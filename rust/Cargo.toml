[package]
name = "imsgcore"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]
name = "imsgcore"

[dependencies]
pyo3 = { version = "0.22", features = ["extension-module", "abi3-py310"] }
rusqlite = { version = "0.31", features = ["bundled"] }
rayon = "1.10"

[profile.release]
lto = true
codegen-units = 1
